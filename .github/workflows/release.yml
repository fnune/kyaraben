name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wait-for-ci:
    runs-on: ubuntu-26.04
    permissions:
      checks: read
    steps:
      - name: Wait for CI to pass
        run: |
          echo "Waiting for CI workflow to complete..."
          for i in {1..60}; do
            STATUS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
              --jq '.check_runs
                    | map(select(.name != "wait-for-ci"))
                    | group_by(.name)
                    | map(max_by(.id))
                    | if length == 0 then "pending"
                      elif any(.status != "completed") then "pending"
                      elif any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") then "failure"
                      else "success" end')
            echo "CI status: $STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "CI passed!"
              exit 0
            elif [ "$STATUS" = "failure" ]; then
              echo "CI failed!"
              exit 1
            fi
            sleep 10
          done
          echo "Timeout waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  release-cli:
    needs: wait-for-ci
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build the CLI, statically against musl, and write the release notes
        uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          cache-paths: go/pkg/mod
          cache-key-files: "**/go.sum"
          command: |
            ./scripts/build-release-cli.sh
            git-cliff --latest --strip header > release-notes.md

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/Kyaraben-CLI-linux-amd64 \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-electron:
    runs-on: ubuntu-26.04
    needs: release-cli
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Go sidecar, statically against musl
        uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          cache-paths: go/pkg/mod
          cache-key-files: "**/go.sum"
          command: ./scripts/build-sidecar.sh

      - name: Build the AppImage
        uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          dev-shell: ci
          cache-paths: .npm
          cache-key-files: ui/package-lock.json
          command: |
            cd ui
            npm ci
            npm run electron:build -- --publish never

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" ui/release/*.AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-nextui:
    runs-on: ubuntu-26.04
    needs: release-cli
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the NextUI paks
        uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          dev-shell: ci
          apt-packages: zip
          cache-paths: go/pkg/mod
          cache-key-files: "**/go.sum"
          working-directory: integrations/nextui
          command: |
            just build-all
            cd dist
            zip -r Kyaraben-NextUI.zip Tools/

      - name: Upload to release
        run: gh release upload "${GITHUB_REF_NAME}" integrations/nextui/dist/Kyaraben-NextUI.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
