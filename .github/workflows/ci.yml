name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          dev-shell: ci
          cache-paths: |
            .cache/go-build
            go/pkg/mod
          cache-key-files: "**/go.sum"
          command: |
            go build ./...
            go build -o ./kyaraben ./cmd/kyaraben
            (cd relay && go build -o ../relay-bin ./cmd/relay)
            KYARABEN_RELAY_BINARY="$PWD/relay-bin" go test -short -race ./...

  relay-build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          dev-shell: ci
          cache-paths: |
            .cache/go-build
            .cache/golangci-lint
            go/pkg/mod
          cache-key-files: "**/go.sum"
          command: |
            cd relay
            go build ./...
            go test -race ./...
            golangci-lint run

  go-lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          dev-shell: ci
          cache-paths: |
            .cache/go-build
            .cache/golangci-lint
            go/pkg/mod
          cache-key-files: "**/go.sum"
          command: golangci-lint run

  ui-lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          dev-shell: ci
          cache-paths: .npm
          cache-key-files: ui/package-lock.json
          command: |
            cd ui
            npm ci
            npm run lint

  site-build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          dev-shell: ci
          cache-paths: .npm
          cache-key-files: site/package-lock.json
          command: |
            cd site
            npm ci
            npm run fmt:check
            npm run build

  electron-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Go sidecar, statically against musl
        uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          cache-paths: go/pkg/mod
          cache-key-files: "**/go.sum"
          command: ./scripts/build-sidecar.sh
      - name: Build the AppImage and run the Playwright tests
        uses: fnune/ci@3003630183e85212ae466a55b971e8fcdaf0dbab
        with:
          dev-shell: ci
          cache-paths: |
            .cache/go-build
            .cache/ms-playwright
            .npm
            go/pkg/mod
          cache-key-files: "**/package-lock.json"
          command: |
            mkdir -p .test/relay
            (cd relay && go build -o ../.test/relay/relay ./cmd/relay)
            cd ui
            npm ci
            npm run electron:build -- --linux AppImage --publish never
            (cd release && ./*.AppImage --appimage-extract >/dev/null && mv squashfs-root app)
            npx playwright install --with-deps chromium
            KYARABEN_APPIMAGE="$PWD/release/app/kyaraben-ui" \
              APPDIR="$PWD/release/app" \
              KYARABEN_RELAY_BINARY="$PWD/../.test/relay/relay" \
              xvfb-run --auto-servernum ../scripts/run-ui-e2e.sh npx playwright test
